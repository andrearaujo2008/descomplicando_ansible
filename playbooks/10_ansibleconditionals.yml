---
- name: Ansible Conditionals
  hosts: all
  become: yes
  tasks:
      - name: DNF | Update System
        ansible.builtin.dnf:
          name: "*"
          state: latest
          update_cache: yes
        when: ansible_distribution == "Rocky"

      - name: APT | Update cache
        ansible.builtin.apt:
          update_cache: yes
        when: ansible_distribution == "Debian" or ansible_hostname == "debian"
     
      - name: APT | Update System
        ansible.builtin.apt:
          name: "*"
          state: latest
        when: ansible_distribution == "Debian" or ansible_hostname == "debian"

...