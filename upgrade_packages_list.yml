---
  - hosts: all
    become: yes

    tasks: 
      - name: Update all packages list from Family Rocky linux
        yum:
          name: '*'
          state: latest
        when: (ansible_facts ['distribution']=="Rocky")

      - name: Update all packages lists from Debian Family
        apt:
          name: '*'
          state: latest
        when: (ansible_facts ['distribution']=="Debian")


