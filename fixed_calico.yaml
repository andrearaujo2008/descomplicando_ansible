
- name: Install Operator Tigera
  ansible.builtin.shell:
    cmd: kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/tigera-operator.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: tigera_install
  failed_when:
    - tigera_install.rc != 0
    - "'AlreadyExists' not in tigera_install.stderr"
  changed_when: tigera_install.rc == 0
  
    
- name: Baixar custom-resources.yaml
  ansible.builtin.shell:
    curl -O https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/custom-resources.yaml
    

- name: Apply the manifest file custom-resources.yaml
  ansible.builtin.shell:
    cmd: kubectl apply -f /home/ubuntu/custom-resources.yaml
    environment:
      KUBECONFIG: /etc/kubernetes/admin.conf #Aponta diretamente para os certificados gerados pelo kubeadm. Assim o kubectl conecta na porta 6443 com autenticao TLS

  register: custom_resources
  failed_when:
    - custom_resources.rc != 0
    - "'AlreadyExists' not in custom_resources.stderr"
  changed_when: custom_resources.rc == 0
  when: inventory_hostname in groups['_kubernetes_instance_1']
  tags:
    - calico