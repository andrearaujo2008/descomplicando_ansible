plugin: amazon.aws.aws_ec2
regions:
  - eu-west-2 # London Region

# Filtra apenas instâncias que estão ligadas (running)
filters:
  instance-state-name: [ 'running' ]

# Define qual IP o Ansible vai usar para se ligar (público ou privado)

hostnames:
  - ip-address # Usa o IP público. Mude para 'private-ip-address' se usar VPN/Bastion
  

# Agrupa as instâncias automaticamente pelas Tags da AWS
keyed_groups:
  - key: tags.Name   # Cria grupos como 'tag_Name_k8s_node'
    separator: '_'
  - key: tags.Role   # Cria grupos como 'tag_Role_kubernetes'
    separator: '_'