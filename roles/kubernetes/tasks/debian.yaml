#Tasks Install Debian packages to install Kubeadm, Kubelet and Kubectl on AWS
#Developed by Andre de Araujo
#Created: 22/07/2026
#Last Modified: 29/07/2026

- name: Criar o arquivo de configuracao k8s.conf com os modulos
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
     overlay
     br_netfilter

- name: Carregar is modulos do kernel
  ansible.builtin.command:
    cmd: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter

- name: Mudar para estado 1 nos arquivos
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

- name: Carregar as configuracoes sysctl
  ansible.builtin.command:
    cmd: sudo sysctl --system

- name: Atualizar os repositorios antes da instalacao
  ansible.builtin.import_tasks: tasks/update_repos.yaml
    
- name: Install packages apt-tranport and curl certificates gnupg and lsb_release
  ansible.builtin.apt:
    pkg:
    - apt-transport-https
    - curl
    - ca-certificates
    - gnupg
    - lsb-release
    
- name: Garantir pasta de chaveiros do APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Baixar e converter a chave para formato binário GPG
  ansible.builtin.shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg    

- name: Adicionar repositorio do Kubernetes
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/ /"
    state: present
    filename: kubernetes
    update_cache: yes

- name: Instalar pacotes do Kubernetes
  ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes

- name: Nao deixar que o kubelet kubeadm e kubectl receba updates
  ansible.builtin.command:
   cmd: sudo apt-mark hold kubelet kubeadm kubectl

- name: Baixar chave GPG do Docker (Nativo do Ansible)
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0755'
    force: no  # Com 'force: no', o Ansible pula o download se o arquivo já existir no destino!
  become: yes
   
- name: Adicionar o repositorio oficial do Docker (Formato DEB822)
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/ubuntu"
    suites: "{{ ansible_distribution_release | lower }}"
    components: [stable]
    architectures: "{{ ansible_architecture == 'x86_64' | ternary('amd64', ansible_architecture) }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Atualizar os repositorios antes da instalacao
  ansible.builtin.import_tasks: tasks/update_repos.yaml

- name: Instalar o Docker nativo do Ubuntu
  ansible.builtin.apt:
    name:
      - docker.io
      - containerd
    state: present
    update_cache: true

- name: APT | Remove packages no longer required
  ansible.builtin.apt:
    autoremove: true 

#Agora, vamos configurar o containerd para que ele funcione adequadamente com o nosso cluster:

- name: Garantir que a pasta do containerd existe
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Gerar a configuracao padrao do containerd
  ansible.builtin.shell: "containerd config default > /etc/containerd/config.toml"
  args:
    creates: /etc/containerd/config.toml

- name: Ativar o SystemdCgroup na configuracao do containerd
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  
  notify: Reiniciar o containerd   
  
  #Por fim, vamos habilitar o serviço do kubelet para que ele inicie automaticamente com o sistema:
  notify: Habilitar o servico kubelet

- name: Instalar as ferramentas para funcionar no control_plane
  ansible.builtin.import_tasks: tasks/control_plane.yaml