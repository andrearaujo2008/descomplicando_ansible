- name: Criar o arquivo de configuracao k8s.conf com os modulos
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
     overlay
     br_netfilter

- name: Carregar is modulos do kernel
  ansible.builtin.command:
    cmd: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter

- name: Mudar para estado 1 nos arquivos
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

- name: Carregar as configuracoes sysctl
  ansible.builtin.command:
    cmd: sudo sysctl --system

#Update repository packages debian
- name: APT | Update cache
  ansible.builtin.apt:
      update_cache: yes
  
#Upgrade the packages that out of date     
#- name: APT | Update System
 # ansible.builtin.apt:
 #     name: "*"
 #     state: latest
  
#Remove packages that will not more longer
- name: APT | Remove packages no longer required
  ansible.builtin.apt:
    autoremove: true 