#Tasks Install Debian packages to install Kubeadm, Kubelet and Kubectl on AWS
#Developed by Andre de Araujo
#Created: 22/07/2026
#Last Modified:

- name: Criar o arquivo de configuracao k8s.conf com os modulos
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
     overlay
     br_netfilter

- name: Carregar is modulos do kernel
  ansible.builtin.command:
    cmd: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter

- name: Mudar para estado 1 nos arquivos
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

- name: Carregar as configuracoes sysctl
  ansible.builtin.command:
    cmd: sudo sysctl --system


- name: Atualizar os repositorios antes da instalacao
  ansible.builtin.import_tasks: tasks/update_repos.yaml
   
  
- name: Install packages apt-tranport and curl
  ansible.builtin.apt:
    pkg:
    - apt-transport-https
    - curl
    - ca-certificates
    - gnupg
    - lsb-release
    

- name: Garantir pasta de chaveiros do APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Baixar e converter a chave para formato binário GPG
  ansible.builtin.shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg    

- name: Adicionar repositorio do Kubernetes
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/ /"
    state: present
    filename: kubernetes
    update_cache: yes

- name: Atualizar os repositorios antes da instalacao
  ansible.builtin.import_tasks: tasks/update_repos.yaml

- name: Instalar pacotes do Kubernetes
  ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes

- name: Nao deixar que o kubelet kubeadm e kubectl receba updates
  ansible.builtin.command:
   cmd: sudo apt-mark hold kubelet kubeadm kubectl


- name: Baixar chave GPG do Docker (Nativo do Ansible)
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /usr/share/keyrings/docker-archive-keyring.gpg
    mode: '0644'
    force: no  # Com 'force: no', o Ansible pula o download se o arquivo já existir no destino!
  become: yes
   

- name: Adicionar repositorio Docker
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  become: yes


- name: APT | Remove packages no longer required
  ansible.builtin.apt:
    autoremove: true 