# tasks file for apache
- name: Include file rocky.yml #Include the file to execute playbook
  tags: rocky
  include: rocky.yml
  when: (ansible_facts['os_family'] == "Rocky")

- name: Include file debian.yml #Include the file to execute playbook
  tags: debian
  include: debian.yml
  when: (ansible_facts['os_family'] == "Debian")

- name: "Cria diretorio que ira hospedar os arquivos do site"
  tags: apache
  file:
    path: "{{ site_folder }}"
    state: directory
    mode: '0755'

- name: "Copia arquivo index.html simples"
  tags: apache
  copy:
    src: index.html
    dest: "{{ site_folder }}"