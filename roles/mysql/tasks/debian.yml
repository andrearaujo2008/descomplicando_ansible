#Install MariaDB in Debian environments

- name: Install Mariadb Server - Debian
  apt:
    update_cache: yes
    name: 
      - mariadb-server
      - python3-mysqldb
      - python3-pymysql
    state: present
  when: (ansible_facts['os_family'] == "Debian")


