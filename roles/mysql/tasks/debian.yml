- name: Install Mariadb Server - Rocky Linux
  
  mysql_user:
    login_unix_socket: "/var/run/mysqld/mysqld.sock"
    name: "{{ db_wp_name }}"
    password: "{{ db_wp_password }}"
    priv: "*.*:ALL,GRANT"
    state: present
  when: (ansible_facts['os_family'] == "Debian")

- name: Removes all anonymous user accounts - Debian
  mysql_user:
    login_unix_socket: "/var/run/mysqld/mysqld.sock"
    name: ''
    host: localhost
    state: absent
  when: (ansible_facts['os_family'] == "Debian")
  notify:
    - start_maria_db


