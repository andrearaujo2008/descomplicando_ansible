- name: Criando um usuario com senha, todos banco de dados previlegiados - Rocky
  mysql_user:
    login_unix_socket: "/var/lib/mysql/mysql.sock"
    name: "{{ db_wp_name }}"
    password: "{{ db_wp_password }}"
    priv: "{{ db_wp_name }}.*:ALL,GRANT"
    state: present
  when: (ansible_facts['os_family'] == "RedHat") 
  tags: db_user_prev

- name: Removes all anonymous user accounts - Rocky Linux
  mysql_user:
    login_unix_socket: "/var/lib/mysql/mysql.sock"
    name: ''
    host: localhost
    state: absent
  when: (ansible_facts['os_family'] == "RedHat")
  
  
