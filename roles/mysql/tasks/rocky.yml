#Instalation MariaDB in Red Hat environments

- name: Install Mariadb Server - Rocky Linux
  yum:
    name: 
      - mariadb-server
      - python-mysqlclient-doc.x86_64
      - python3-PyMySQL.noarch
      - python3-mysqlclient.x86_64
    state: present
  when: (ansible_facts['os_family'] == "RedHat")
  notify: maria
  tags: mdb_install

# This task it will force to run handler after installed MariaDB server. (Because handlers by default it will execute after that executed all tasks) 
- name: Flush handlers
  meta: flush_handlers
  


